# reseau.conf : plan d'adressage du projet INFRARED
# Lu (source) par tous les scripts du dossier reseau/

BRIDGE="br-infra"          # bridge dedie au projet (sans dnsmasq, contrairement a lxcbr0)
SUBNET="10.10.0.0/24"
PREFIX="24"
GATEWAY="10.10.0.1"        # IP de la VM sur le bridge = passerelle des conteneurs
DOMAIN="infrared.lan"
DNS_IP="10.10.0.11"        # conteneur dns
DNS_FALLBACK="1.1.1.1"     # a retirer quand le serveur DNS du projet marche
LXCPATH="/var/lib/lxc"

# nom:ip  -> "dhcp" = le conteneur recevra son IP du serveur DHCP du projet
MACHINES="annuaire:10.10.0.10 dns:10.10.0.11 dhcp:10.10.0.12 nfs:10.10.0.13 ssh:10.10.0.14 web:10.10.0.15 client1:dhcp client2:dhcp"

# Plage reservee aux clients (pour le futur script du serveur DHCP)
DHCP_RANGE_START="10.10.0.100"
DHCP_RANGE_END="10.10.0.200"
